# Hooks call the mise-pinned binaries on PATH (repo: local / language: system),
# not self-pinning hook repos. mise.toml is the single source of tool versions;
# this removes the double-install, the version drift, and the per-hook network
# fetch. Run under `mise exec -- pre-commit` so the binaries resolve (ADR 0014).

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        require_serial: true # shellcheck detects cross-file sourcing this way
        # -x follows `source=` directives across files. Without it, the
        # commit-stage hook (staged files only) misses cross-file definitions
        # while --all-files passes them in the same invocation.
        # --enable=SC2162 flags `read` without -r (off by default); a missing
        # -r silently eats backslashes and corrupts multi-line JSON payloads.
        args: [-x, --enable=SC2162]

      - id: shfmt
        name: shfmt
        entry: shfmt
        language: system
        types: [shell]
        exclude_types: [csh, tcsh]
        # -d makes shfmt exit non-zero on a formatting diff instead of printing
        # to stdout and passing. Without it the hook never fails (it is a no-op).
        args: [-i, "2", -ci, -d]

      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/

      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false # --staged scans the index, not passed paths

      - id: yamllint
        name: yamllint
        entry: yamllint
        language: system
        types: [file, yaml]
        args: [-d, "{extends: default, rules: {line-length: {max: 120}, document-start: disable}}"]
