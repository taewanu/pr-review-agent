version: 2

updates:
  # ci.yml pins actions to commit SHAs, which never move on their own.
  # Dependabot bumps each pinned SHA and its version comment as releases land,
  # the only thing that advances a SHA pin.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    # checkout and mise-action are two distinct actions; grouping lands both
    # in one weekly PR instead of one per action.
    groups:
      actions:
        patterns:
          - "*"
