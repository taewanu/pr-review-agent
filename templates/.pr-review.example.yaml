language: ko
profile: chill

reviewers:
  - default
  - security

path_filters:
  - "!**/*.lock"
  - "!**/node_modules/**"
  - "!**/dist/**"
  - "!**/*.snap"

path_instructions:
  - path: "src/api/**"
    instructions: "API 라우트는 입력 검증과 인증을 우선 확인"
  - path: "**/*.test.ts"
    instructions: "테스트 안정성 위주. 사소한 스타일은 무시"

instructions: |
  이 프로젝트는 Next.js 15 + TypeScript + Tailwind.
  Server Component / Client Component 경계를 특히 살펴주세요.

max_comments_per_review: 8
